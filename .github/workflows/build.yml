name: Build APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      M3U_URL: ${{ vars.M3U_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build release APK (minified)
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OpenIptv-apk
          path: app/build/outputs/apk/release/*.apk
      # One permanent release, tag "latest", always pointing at the newest build of main.
      # Stable link: https://github.com/<owner>/<repo>/releases/download/latest/OpenIptv.apk
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk OpenIptv.apk
          git tag -f latest
          git push -f origin refs/tags/latest
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --verify-tag --latest --title "Latest" --notes "Newest build of main."
          gh release edit latest --notes "Built from ${GITHUB_SHA::7}" --latest
          gh release upload latest OpenIptv.apk --clobber
