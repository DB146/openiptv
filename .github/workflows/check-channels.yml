name: Check channels

# Tests every stream in the m3u file. Channels that fail several runs in a row
# are temporarily disabled (commented out with "#DISABLED# "); they are
# re-enabled automatically as soon as they work again.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Consecutive failed runs before a channel is disabled"
        default: "3"

permissions:
  contents: write

concurrency:
  group: check-channels
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check streams
        run: |
          python3 .github/scripts/check_channels.py m3u \
            --state .github/channel-status.json \
            --threshold "${{ inputs.threshold || '3' }}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m3u .github/channel-status.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update channel status [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
